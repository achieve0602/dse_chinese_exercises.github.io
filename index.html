<script>(function(){
"use strict";
const PREFIX="dseQuiz_v1_",DATA_KEY=PREFIX+"data",ENCOURAGEMENT_KEY=PREFIX+"encouragement";
const books=["《論仁論孝論君子》","《魚我所欲也》","《逍遙遊》","《勸學》","《廉頗藺相如列傳》","《出師表》","《師說》","《始得西山宴遊記》","《岳陽樓記》","《青玉案·元夕》","《念奴嬌·赤壁懷古》","《聲聲慢·秋情》"];

const typeName={mc:"MC 選擇題",essay:"長答題"};
const encouragements=[
"錯題不是退步，是下一次答得更穩的線索。",
"你正在累積理解，慢一點也算前進。",
"讀懂一句原文，就是向全篇多走一步。",
"先看題眼，再找證據；你已經知道從哪裏開始。",
"每一分都有方法，逐點整理就能看見進步。",
"答錯一題，就多認識一個容易混淆的概念。",
"把引文和分析連起來，你的答案會更有力。",
"今天的練習，正在變成考場上的底氣。",
"不要急着完美，清楚地進步就很好。",
"肯回看答案，本身就是很好的學習習慣。",
"把一個重點說清楚，比堆很多句更重要。",
"你比剛開始時多懂了一點，這就是進步。"
];
function makeMC(id,chapter,difficulty,quote,question,options,answerIndex,explanation,distractorAnalysis){
 return{id:id,chapter:chapter,difficulty:difficulty,type:"mc",quote:quote,question:question,options:options,answerIndex:answerIndex,explanation:explanation,distractorAnalysis:distractorAnalysis,marks:0,rubric:[],modelAnswer:"",diagnosis:"",commonMistakes:distractorAnalysis}
}
function makeEssay(id,chapter,difficulty,quote,question,points,modelAnswer,diagnosis){
 return{id:id,chapter:chapter,difficulty:difficulty,type:"essay",quote:quote,question:question,options:[],answerIndex:0,explanation:"",distractorAnalysis:[],marks:points.length,rubric:points.map(function(p){return{point:p[0],keywords:p[1],mark:1}}),modelAnswer:modelAnswer,diagnosis:diagnosis,commonMistakes:[]}

const bank=[
makeMC("mc01",books[0],"basic","「君子喻於義，小人喻於利。」","孔子以「義」與「利」對照，主要指出君子與小人有何分別？",["君子重視道義，小人較看重私利。","君子凡事追求利益，小人只講規矩。","君子天生富有，小人天生貧困。","君子不與人交往，小人善於結交朋友。"],0,"「喻」有明白、看重之意。孔子以道義和私利作對照，指出兩種不同的價值取向。",["正確。抓住「義」與「利」的對比。","把兩者看重的對象倒轉。","原句談價值判斷，並非身分或財富。","原句沒有討論交友能力。"]),
makeMC("mc02",books[1],"basic","「生，亦我所欲也；義，亦我所欲也。二者不可得兼，舍生而取義者也。」","這段話最能說明孟子提出的哪一項價值判斷？",["人在任何情況下都必須放棄生命。","道義與生命衝突時，義比生更值得堅守。","只要能保全生命，任何做法都合理。","道義只適用於賢者，普通人不必遵守。"],1,"孟子以「生」和「義」都是所欲作為前提，再指出兩者不可兼得時要「舍生取義」，凸顯義的價值。",["把有條件的取捨擴大成任何情況都要捨生。","正確。指出兩種價值不可兼得時的取捨。","與「舍生而取義」的論旨相反。","孟子指出這種心並非賢者獨有。"]),
makeEssay("es01",books[2],"top","「若夫乘天地之正，而御六氣之辯，以遊無窮者，彼且惡乎待哉！」","作者描寫理想中的逍遙境界。試結合篇旨，說明這種境界與前文大鵬的飛行有何分別。",[["大鵬仍須憑藉風力等外在條件",["風","憑藉","依賴","有所待","風力"]],["理想境界順應天地自然及六氣變化",["天地","自然","六氣","變化","順應"]],["至人不依賴外物，達到無所待的精神自由",["無所待","不依賴","依賴外物","不待","自由"]],["逍遙境界超越有限認知或功名束縛",["功名","名利","有限","超越","無窮","束縛"]]],"大鵬雖能扶搖而上，仍須憑藉厚積之風才能負載，故仍有所待。理想境界則是順應天地自然、駕馭六氣變化而遊於無窮，不依賴外在條件；至人亦能超越有限的功名與認知束縛，達到精神自由。","作答要比較兩種境界，並以「有所待／無所待」作核心，不宜只抄譯原句。"),
makeEssay("es02",books[3],"basic","「君子生非異也，善假於物也。」","荀子以這句話說明甚麼道理？試結合「善假於物」說明學習者可以怎樣進步。",[["君子的天賦本性並非異於常人",["生非異","天賦","本性","並非異於常人"]],["「假」是憑藉、利用外在條件",["憑藉","利用","借助","假"]],["可借助學習、老師或方法拓展能力",["學習","老師","方法","工具","環境","知識"]],["持續學習、善用資源可彌補不足並提升自己",["彌補","提升","進步","不足","持續","成長"]]],"荀子認為君子的天賦本性與常人沒有本質差異，差別在於能否善於憑藉外物。學習者可借助老師指導、書本知識和合適方法，不斷修正不足、累積能力，因此能透過持續學習逐步進步。","須把「假」解作憑藉，並將道理連結到具體學習方法。"),
makeEssay("es03",books[4],"advanced","「廉頗聞之，肉袒負荊，因賓客至藺相如門謝罪。」","這段描寫刻畫廉頗怎樣的性格？這一舉動對「將相和」有甚麼作用？",[["廉頗真誠認錯並願意謝罪",["認錯","謝罪","負荊","真誠","受罰"]],["廉頗能放下身段、知錯能改",["放下身段","知錯能改","改過","謙遜"]],["藺相如接受道歉，兩人消除嫌隙",["接受","和解","嫌隙","和好","諒解"]],["將相和有助團結力量、共同維護趙國",["團結","趙國","國家","共同","大局"]]],"廉頗以肉袒負荊親自登門謝罪，顯示他誠懇認錯、知錯能改，也能放下身段。藺相如接受道歉後，兩人消除嫌隙、重歸於好，使將相團結，能共同維護趙國大局。","人物分析要由行動推論性格，並補充事件對人物關係和國家的作用。"),
makeEssay("es04",books[5],"basic","「親賢臣，遠小人，此先漢所以興隆也；親小人，遠賢臣，此後漢所以傾頹也。」","諸葛亮以先漢、後漢作對照，向後主提出甚麼治國勸告？這種寫法有何作用？",[["應親近賢臣、疏遠小人",["親賢","賢臣","遠小人","疏遠小人"]],["先漢親賢遠佞而興隆",["先漢","興隆","親賢","遠小人"]],["後漢親小人、遠賢臣而傾頹",["後漢","傾頹","親小人","遠賢"]],["正反對比有說服力，提醒後主借鑑成敗",["對比","說服力","借鑑","警惕","成敗"]]],"諸葛亮勸後主親近賢臣、疏遠小人。他以先漢親賢而興隆作正面例子，再以後漢親小人、遠賢臣而傾頹作反面例子，形成鮮明對比，讓後主從前朝成敗中吸取教訓，增加勸諫的說服力。","要同時回答勸告內容及對比作用，只翻譯史事會欠缺分析。"),
makeEssay("es05",books[6],"top","「是故無貴無賤，無長無少，道之所存，師之所存也。」","韓愈如何藉這句話說明從師原則？試指出論點及對當時風氣的針對性。",[["從師不應受地位高低限制",["貴賤","地位","身分","無貴無賤"]],["從師不應受年齡長幼限制",["長少","年齡","年長","年幼"]],["應以是否懂得道理作為從師依據",["道理","知識","所存"]],["針對士大夫恥於從師、以身分年齡自矜",["士大夫","恥學於師","恥於從師","自矜","風氣"]]],"韓愈認為從師不應計較身分貴賤或年齡長幼，判斷準則在於誰能傳授道理，即「道之所存，師之所存」。這針對士大夫恥於從師、以身分或年齡自矜的風氣，重申求道比身分高低更重要。","先解釋從師原則，再指出它所反駁的士大夫觀念。"),
makeMC("mc03",books[7],"advanced","「然後知是山之特立，不與培塿為類。」","「特立」與「不與培塿為類」除了描寫西山形貌，也寄寓甚麼？",["西山獨立不凡的景象與作者暫忘困境、超然自得的心境相互映照。","作者認為所有山嶺都低小平凡，只有西山適宜遊覽。","作者記錄山中居民身分，並批評他們不合群。","作者借西山宣告自己完全放棄政治理想。"],0,"西山高峻突出，與周圍小丘不同；作者由此感到心境開闊，景物描寫亦映照其宴遊時暫時超脫日常憂懼的感受。",["正確。兼顧山勢特點和遊覽時的精神感受。","不能推論作者貶低所有其他山。","「培塿」指小土丘，句中沒有描寫居民。","文章描寫遊覽時的感受，不是永久放棄理想。"]),
makeEssay("es06",books[8],"advanced","「先天下之憂而憂，後天下之樂而樂。」","試解釋這句話所表達的政治抱負，並說明它與前文遷客騷人的情緒有何不同。",[["以天下百姓為念",["天下","百姓","民生","福祉"]],["承擔在先、享樂在後的責任感",["先憂","後樂","責任","承擔","奉獻"]],["不因外在景物或個人處境改變志向",["不以物喜","不以己悲","外物","個人","志向"]],["遷客騷人因景物悲喜；古仁人超越個人得失",["遷客騷人","陰晴","景物","悲喜","個人得失","超越"]]],"這句表達以天下百姓為念、先承擔憂患而後享受安樂的政治責任感。前文遷客騷人因景物陰晴和自身處境而悲喜；古仁人則不以外物或個人得失改變志向，胸懷更能超越一己悲歡。","比較兩者的情緒來源，並扣緊「先憂後樂」的公共關懷。"),

makeMC("mc05",books[10],"top","「大江東去，浪淘盡，千古風流人物。」","這個開篇在全詞結構上的主要作用是甚麼？",["由眼前大江引出歷史人物，開展懷古並為追想周瑜作鋪墊。","直接交代周瑜戰勝曹操的全部經過。","象徵詞人對功名毫無興趣，與下文無關。","描寫江岸秋景，為下片思鄉作鋪墊。"],0,"開篇由大江的壯闊景象聯想到歷代人物及歷史興亡，奠定雄渾懷古基調，並引出下片對周瑜的追憶。",["正確。連結景物、歷史聯想與下文人物追憶。","開篇沒有敘述戰事細節。","江水與歷史興亡相關，並非與下文無關。","全詞重心是懷古與人生感慨。"]),

makeMC("mc07",books[2],"advanced","「小知不及大知，小年不及大年。」","作者以「小知」與「大知」、「小年」與「大年」作對比，主要帶出甚麼？",["不同生命與認知有其局限，不能以狹小經驗衡量廣闊境界。","年紀較大的人必定比年輕人更有智慧。","小知識只對短壽者有用，與篇旨無關。","所有生物的壽命和見識其實完全相同。"],0,"作者藉大小、長短的對照，指出認知和生命尺度各有局限，並提醒讀者勿以有限經驗妄測更大的境界。",["正確。指出尺度差異與有限認知。","把篇章的哲理誤讀成人生年齡排名。","原句正是篇中論證的一部分，並非無關。","對比明確指出差異，並非完全相同。"]),

makeEssay("es07",books[0],"basic","「今之孝者，是謂能養。至於犬馬，皆能有養；不敬，何以別乎？」","孔子如何說明孝不應只停留在供養父母？試解釋「敬」的重要。",[["指出只供養而欠缺敬意不足以體現孝",["供養","能養","不敬","物質"]],["指出犬馬也能得到餵養，故單有供養未足以區分",["犬馬","餵養","何以別","分別"]],["說明敬重、關懷父母是孝的重要內容",["敬重","尊敬","關懷","敬"]],["提出孝行應兼有實際照顧與真誠態度",["照顧","真誠","態度","兼有"]]],"孔子指出，孝若只等同供養，便與餵養犬馬沒有明顯分別；因此子女除了照顧父母，也要有敬重和關懷的態度，讓物質供養與真誠敬意並重。","要分清供養與敬愛，不能把孝簡化為提供物質需要。"),
makeEssay("es08",books[1],"advanced","「非獨賢者有是心也，人皆有之，賢者能勿喪耳。」","孟子認為「是心」為人人所有。試說明這個觀點與篇中「舍生取義」的論證有何關係。",[["「是心」指人皆有的羞惡／道義之心",["羞惡","道義","是心","本心"]],["指出這種心並非賢者獨有，人人具備",["非獨","人皆有之","人人","皆有"]],["賢者的可貴在於保存本心、不使其喪失",["勿喪","保存","不喪失","賢者"]],["連結舍生取義，說明危急時仍可守義是保存本心的表現",["舍生取義","守義","取義","保存本心"]]],"「是心」指羞惡和道義之心，孟子認為人人都有。賢者並非天生獨具此心，而是能保存它、不讓它喪失；在生命與道義衝突時舍生取義，正是守住本心的表現。","要把人人皆有的道德本心和危急時的道義抉擇連結起來。"),
makeEssay("es09",books[7],"advanced","「自余為僇人，居是州，恆惴慄。」","柳宗元在遊西山之前的生活與心境如何？試說明西山之遊如何帶來轉變。",[["指出作者遭貶謫、身為罪人或失意者",["僇人","貶謫","失意","罪人"]],["指出居永州時常感不安、恐懼",["惴慄","不安","恐懼","憂懼"]],["西山宴遊使作者暫時忘卻日常煩憂",["忘憂","忘卻","暫忘","心凝形釋"]],["指出景物與心境相融，帶來開闊超然的感受",["開闊","超然","與萬化冥合","心境","融為一體"]]],"作者遭貶後居於永州，常感不安惶恐。登西山宴遊時，他沉浸於高峻景色，暫忘日常憂懼，並感到心神開闊，與天地自然相融，形成與平日不同的超然感受。","答案要呈現遊前憂懼與遊後開闊的對照，並說明景物如何牽動心境。"),
makeEssay("es10",books[9],"top","「眾裏尋他千百度，驀然回首，那人卻在，燈火闌珊處。」","試分析詞作結尾的尋人情節如何形成情感和意境上的轉折。",[["指出先在人群中多次尋覓，營造追尋與期待",["眾裏","尋","千百度","追尋","期待"]],["指出「驀然回首」帶來出乎意料的發現",["驀然回首","忽然","意外","發現"]],["指出「燈火闌珊」與前面熱鬧燈市形成對照",["燈火闌珊","冷清","熱鬧","對比","反差"]],["指出結尾含蓄地突顯所尋之人的清雅／孤高或詞境幽遠",["清雅","孤高","幽遠","含蓄","超脫"]]],"詞人在人群中多次尋覓，累積期待；忽然回首，才發現所尋之人在燈火稀疏處。結尾由喧鬧人群轉到清幽角落，形成意外而含蓄的轉折，突顯人物的清雅孤高，亦留下悠遠想像。","比較熱鬧與闌珊的場景，並解釋轉折帶來的含蓄效果。"),
makeEssay("es11",books[10],"advanced","「人生如夢，一尊還酹江月。」","試解釋這兩句所流露的人生感慨，並說明「酹江月」如何收束懷古情懷。",[["指出人生短暫、世事如夢的感慨",["人生如夢","短暫","如夢","無常"]],["指出詞人面對歷史人物與自身處境所生的感觸",["歷史","周瑜","自身","感慨","懷古"]],["解釋「酹」是以酒灑地／向江月祭奠",["酹","灑酒","祭奠","江月"]],["指出借祭酒江月寄託情懷，使個人感慨回到壯闊江景",["寄託","感情","江景","收束","豁達"]]],"詞人由周瑜等歷史人物想到人生短暫、世事如夢。「酹」是灑酒祭奠，他把酒灑向江月，將懷古和個人感慨寄託於眼前江景，令全詞在蒼茫而略帶豁達的意境中收束。","須解釋「酹」的動作及其寄情作用，避免只把兩句概括成消極悲觀。"),
makeEssay("es12",books[11],"advanced","「梧桐更兼細雨，到黃昏、點點滴滴。」","詞人如何結合景物、聲音與時間變化渲染愁情？試分析這兩句。",[["指出梧桐與細雨構成清冷、寂寥的秋景",["梧桐","細雨","清冷","寂寥","秋景"]],["指出「點點滴滴」以聲音描寫雨聲",["點點滴滴","聲音","雨聲","聽覺"]],["指出黃昏延長孤寂感，景物和時間共同渲染情緒",["黃昏","時間","孤寂","愁情","渲染"]],["連結全詞，說明景聲觸發或加深詞人淒苦心境",["淒苦","愁苦","心境","加深","觸發"]]],"梧桐和細雨構成清冷寂寥的景象；「點點滴滴」以聽覺寫雨聲，黃昏又加深時間流逝中的孤寂感。景物、聲音和時間交織，令愁情更綿密深沉。","不要只列景物，要說明聲音和黃昏如何加深愁情。")

[3,"君子博學而日參省乎己，則知明而行無過矣。","博學與自省並重","廣泛學習並每日反省，能使見識明達、行為少犯過失。","只需讀書，不必反省實踐。","自省會妨礙知識增長。","君子不會犯錯，所以無需學習。"],
[3,"吾嘗終日而思矣，不如須臾之所學也。","思與學的關係","荀子以親身體會指出空想不如實際學習有效。","思考完全無用，任何情況都應停止思考。","短暫學習必然勝過長期積累。","學習只需背誦，不必理解。"],
[3,"登高而招，臂非加長也，而見者遠。","善用條件","站高處招手令遠方的人看見，說明善用條件可擴大自身作用。","登高會使手臂實際變長。","人的能力只由天生體格決定。","此例說明招手比學習更重要。"],
[3,"假輿馬者，非利足也，而致千里。","借助外物","借助車馬能到遠方，並非腳快，說明善用條件可補自身不足。","只有天生善跑的人才能到遠方。","車馬使人的雙腿力量永久增加。","荀子反對借助工具和他人。"],
[3,"鍥而舍之，朽木不折；鍥而不舍，金石可鏤。","持續不懈","雕刻中途放棄便不能折朽木，堅持則金石可雕，突出恆心的重要。","只要工具鋒利，是否堅持並不重要。","金石比朽木容易雕刻。","學習成敗全由天賦決定。"],
[3,"蚓無爪牙之利，筋骨之強，上食埃土，下飲黃泉，用心一也。","專一的力量","蚯蚓條件不強仍能上下求食，原因是用心專一。","蚯蚓比螃蟹更有力的爪牙。","專一使人不必運用任何能力。","蚯蚓成功是因為外在條件優越。"],
[4,"臣願奉璧往使。城入趙而璧留秦；城不入，臣請完璧歸趙。","奉璧使秦的膽識","藺相如主動承擔出使，並預先提出秦不交城便完璧歸趙的應對。","藺相如未作打算便把和氏璧交給秦王。","藺相如只想藉出使換取個人官位。","此句表明趙國已決定放棄城池。"],
[4,"秦城恐不可得，徒見欺；趙城恐不可得，徒見欺。","相如洞悉秦王用意","相如指出秦若不交城、趙若不交璧，都可能受欺，表現其審慎和預判。","相如相信秦王必會守約交城。","趙國已取得秦城，無須再交涉。","相如認為和氏璧沒有外交價值。"],
[4,"相如持其璧睨柱，欲以擊柱。","以璧相脅的應變","相如持璧怒視柱子，作勢撞擊，以果斷行動制止秦王欺詐。","相如真的把璧擊碎，放棄使命。","相如以和氏璧向秦王求取私利。","此舉顯示相如害怕秦王而退讓。"],
[4,"相如因持璧卻立，倚柱，怒髮上衝冠。","神態動作描寫","「持、卻立、倚柱」等動作及神態描寫，呈現相如據理力爭的氣勢。","作者只描寫相如外貌，沒有刻畫性格。","相如此時已把和氏璧交給秦國。","「怒髮」表示相如沒有任何策略。"],
[4,"秦王齋五日後，乃設九賓於廷。","秦王受迫守禮","秦王安排隆重儀式，反映相如以理據和行動迫使秦王重視交涉。","秦王齋戒表示已正式割城予趙。","九賓儀式是廉頗在澠池所安排。","相如不在場，事件與他無關。"],
[4,"臣以為布衣之交尚不相欺，況大國乎？","相如據理力爭","相如以平民交往尚且不欺作比，反問大國怎可失信，語氣有力。","相如承認平民可以欺騙，大國更無須守信。","此句以武力威脅取代外交理據。","相如談論私人友誼，與璧城交涉無關。"],
[4,"以先國家之急而後私讎也。","廉頗負荊請罪","廉頗把國家急務放在私人仇怨之前，解釋自己向相如謝罪的原因。","廉頗因害怕相如報復才道歉。","廉頗認為私人恩怨比國家利益重要。","此句由秦王說出，與將相和無關。"],
[4,"臣所以去親戚而事君者，徒慕君之高義也。","門客以大義勸相如","門客以仰慕相如高義解釋追隨原因，並提醒其處理廉頗衝突。","門客只為財富和官職而留下。","門客勸相如與廉頗決一死戰。","相如不重視門客的意見。"],
[4,"廉頗聞之，肉袒負荊，因賓客至藺相如門謝罪。","負荊請罪","廉頗赤身負荊到相如門前謝罪，以實際行動承認過失，化解衝突。","廉頗帶荊條到相如門前示威。","相如命人懲罰廉頗，兩人決裂。","負荊只象徵廉頗準備出征。"],
[4,"卒相與歡，為刎頸之交。","將相和的結果","二人終能和好並結成生死之交，顯示國家利益凌駕私人恩怨。","兩人表面合作，內心仍互相陷害。","結交刎頸之交使趙國失去軍力。","故事最後由相如獨自離開趙國。"],
[5,"誠宜開張聖聽，以光先帝遺德，恢弘志士之氣。","廣開言路","諸葛亮勸後主擴大聽取意見，以彰顯先帝遺德並鼓舞臣下。","後主應只聽取近臣意見，避免外議。","開張聖聽是要求後主親自領兵出征。","作者認為先帝遺德與納諫無關。"],
[5,"不宜妄自菲薄，引喻失義，以塞忠諫之路也。","避免妄自菲薄與阻塞諫路","作者勸後主不要看輕自己或引用不當，以免阻塞臣下忠諫。","後主應拒絕所有批評以維持威信。","引喻失義指臣下說話太直接。","妄自菲薄能鼓勵群臣直言。"],
[5,"宮中府中，俱為一體；陟罰臧否，不宜異同。","賞罰公平","宮廷與丞相府應一視同仁，賞善罰惡不可因身分而異。","宮中和府中應各自制定互不相干的法令。","只有宮中官員需要接受賞罰。","賞罰應由後主按親疏隨意決定。"],
[5,"親賢臣，遠小人，此先漢所以興隆也。","親賢遠佞","親近賢臣、疏遠小人是先漢興盛的原因，作者藉歷史勸諫後主。","先漢興盛是因為遠離所有臣子。","親近小人有助君主掌握民心。","此句只在評論漢代疆域大小。"],
[5,"親小人，遠賢臣，此後漢所以傾頹也。","先後漢對照","以後漢親小人、遠賢臣而衰敗，與先漢形成正反對比，強化勸諫。","後漢因親賢臣而衰敗。","先後漢興衰與君主用人無關。","作者只批評後漢將領的武藝。"],
[5,"先帝不以臣卑鄙，猥自枉屈，三顧臣於草廬之中。","三顧茅廬與知遇","先帝不嫌諸葛亮身分低微而三次探訪，表現知遇之恩。","諸葛亮先任高官，後主才邀他出山。","三顧茅廬是作者責怪先帝耽誤政事。","卑鄙在此表示諸葛亮品格惡劣。"],
[5,"受任於敗軍之際，奉命於危難之間。","危難受任","諸葛亮回憶在敗軍危急之際受命，突出先帝託付重大及自身忠誠。","諸葛亮在蜀漢最強盛時才開始任職。","此句說明諸葛亮主動背叛先帝。","危難只指諸葛亮個人的家庭困境。"],
[5,"今南方已定，兵甲已足，當獎率三軍，北定中原。","北伐目標","南方既定、軍備充足後，作者表明北定中原、復興漢室的行動方向。","北伐的目標是擴張私人封地。","南方未定，作者主張立即放棄軍事行動。","北定中原是後主而非諸葛亮的私人願望。"],
[5,"此臣所以報先帝而忠陛下之職分也。","報恩與忠職","北伐既是報答先帝知遇，也是諸葛亮對後主履行忠臣職分。","作者只忠於先帝，拒絕承認後主。","報恩與北伐目標完全無關。","此句表示作者要求後主代替他出征。"],
[5,"臨表涕零，不知所言。","結尾流露深情","臨表落淚的自述流露諸葛亮對先帝、後主及國事的深厚感情。","作者因不懂文書格式而不知如何寫作。","結尾以歡樂語調表示北伐必勝。","涕零指下令群臣停止進諫。"],
[6,"師者，所以傳道、受業、解惑也。","教師的職責","教師負責傳道、授業、解惑，功能不只教授書本知識。","教師只負責講解字詞，不涉及思想。","學生的疑惑不在教師職責之內。","傳道只指傳授做官的方法。"],
[6,"人非生而知之者，孰能無惑？","從師解惑的必要","人不是天生便懂道理，遇到疑惑需要向老師學習。","所有人出生便掌握全部知識。","有疑惑表示個人天資不足，不應求師。","韓愈認為學習不能改善疑惑。"],
[6,"道之所存，師之所存也。","以道為師的準則","老師的資格取決於道理所在，不應只看年齡或地位。","年紀最大的人必定是所有人的老師。","只有官位相同的人才能互相學習。","道理只存在於古代教師的著作。"],
[6,"無貴無賤，無長無少，道之所存，師之所存也。","從師不拘身分年齡","只要有道理值得學習，無論貴賤長幼都可作為老師。","只有年長貴族才可接受教導。","老師必須與學生同齡同職。","求師會削弱長幼秩序，因此不應鼓勵。"],
[6,"古之聖人，其出人也遠矣，猶且從師而問焉。","古聖人從師","古代聖人本領出眾仍向老師請教，反襯今人恥學的不合理。","聖人不必學習，從師只是裝飾。","古聖人從師證明老師比學生永遠高等。","此句讚揚拒絕求師的態度。"],
[6,"今之眾人，其下聖人也亦遠矣，而恥學於師。","今人恥學的矛盾","一般人能力不及聖人，卻以從師為恥，構成鮮明反差和批評。","今人能力勝過聖人，所以毋須求師。","韓愈認為恥學是維護尊嚴的正確態度。","作者只比較古今人的年齡差異。"],
[6,"巫醫樂師百工之人，不恥相師。","百工不恥相師","各行業工匠不以互相學習為恥，反襯士大夫恥師的荒謬。","百工拒絕向同行學習。","百工之人比士大夫更不重視技藝。","韓愈主張只有工匠需要老師。"],
[6,"小學而大遺，吾未見其明也。","小學大遺","士大夫重視句讀小學，卻忽略從師問道的大道理，批評其本末倒置。","兒童應先學大學課程，不必學句讀。","小學和大遺是兩種值得提倡的教育制度。","作者認為句讀與從師都沒有價值。"],
[6,"聞道有先後，術業有專攻，如是而已。","聞道先後與專長","每人聞道有先後、專長不同，故可互相學習，老師不必樣樣勝過學生。","老師在所有方面必須比學生年長。","術業專攻表示只可向同一人學習。","學生一旦超越老師便不必尊敬老師。"],
[6,"李氏子蟠，年十七，好古文，六藝經傳皆通習之。","李蟠作結","李蟠不受時俗影響而從師學古文，作者藉此交代寫作緣起並表揚其態度。","李蟠拒絕古文，只求功名。","寫李蟠是為了證明年輕人不能從師。","篇末只交代人物年齡，與主旨無關。"],
[7,"僇人欒欒兮若囚拘，喑噫嘔喻兮。","謫居的苦悶","被貶者感到惴慄鬱結，像受拘束，交代作者出遊前的抑鬱心境。","作者一開始已感到完全自由愉快。","僇人指當地受尊敬的官員。","此句描寫西山高峻，而非人的心境。"],
[7,"未始知西山之怪特。","西山特立","作者先前遊覽眾山，仍未發現西山奇特，為「始得」西山作鋪墊。","作者從未離開住所，沒有遊山。","所有山景都完全相同，西山並無特色。","此句表示作者早已熟悉西山。"],
[7,"過湘江，緣染溪，斫榛莽，焚茅茷。","登西山的行動","作者渡江沿溪、砍除草木，具體交代尋訪西山的過程。","作者乘船直接登上西山山頂。","砍除草木是為了開墾農田牟利。","此處描寫他在宴會中準備菜餚。"],
[7,"悠悠乎與顥氣俱，而莫得其涯。","西山景象開闊","「悠悠」及無邊界的顥氣描寫視野開闊，呈現登高後心境的舒展。","作者認為景物狹窄，令人窒息。","顥氣只指房間內的煙霧。","登山令作者更加煩躁不安。"],
[7,"數州之土壤，皆在衽席之下。","登高俯瞰","數州大地彷彿在席下，從高處俯瞰的描寫突出西山之高和視野之廣。","作者以為數州土地真的移到席上。","此句表示西山低矮，平望即可看見。","作者只關心土地價值，沒有觀景。"],
[7,"心凝形釋，與萬化冥合。","物我冥合","心神凝定、形體舒展，作者與自然萬物融為一體，達到超然感受。","作者身體受束縛，無法觀看景色。","冥合是指作者失去意識，昏迷不醒。","作者仍只以煩悶心情觀看山水。"],
[7,"引觴滿酌，頹然就醉，不知日之入。","沉醉忘時","作者飲酒至醉而不覺日落，表現宴遊時忘我投入。","作者因趕路而拒絕飲酒。","日落象徵作者立即離開西山。","此句說明宴遊使作者更受官場拘束。"],
[7,"蒼然暮色，自遠而至，至無所見。","遊後暮色與收束","暮色漸至、景物消失，交代遊覽結束並帶出作者沉醉後的感受。","天色由黑轉亮，象徵旅程開始。","作者在暮色中仍清楚看見遠方。","暮色描寫與遊覽經歷無關。"],
[7,"然後知吾向之未始遊，遊於是乎始。","始得的頓悟","作者回看以往遊山未真正領會，遇西山後才感到真正開始遊覽。","作者認為以前的行程根本沒有移動。","西山只是眾多山中普通的一座。","「始」只表示遊覽日期，沒有心境轉變。"],
[7,"故為之文以志。","寫作記遊","作者因這次獨特體驗寫文記錄，收束遊記並點出寫作緣由。","作者只為記錄宴席菜單而寫文。","本文是替當地官府撰寫的公告。","寫作目的是掩飾自己沒有登山。"],
[8,"政通人和，百廢具興。","滕子京政績","政事順利、百廢俱興，作者肯定滕子京謫守後的治理成果。","滕子京因政務失敗而完全放棄治理。","百廢具興表示百姓拒絕參與政事。","作者只稱讚岳陽樓建築，沒有寫政績。"],
[8,"乃重修岳陽樓，增其舊制。","重修岳陽樓","滕子京重修並擴建岳陽樓，構成作記的背景。","岳陽樓由范仲淹親自興建。","重修使岳陽樓規模縮小。","重修一事與文章寫作緣起無關。"],
[8,"覽物之情，得無異乎？","覽物生情的提問","作者由眼前景物引出遷客騷人不同的情感反應，轉入兩種景境描寫。","作者認為景物不會影響人的心情。","此問只詢問讀者是否到過岳陽樓。","篇章接着會列出相同的兩種快樂。"],
[8,"若夫霪雨霏霏，連月不開。","陰雨景與悲","連月陰雨、天色不開，營造陰冷昏暗的景象，呼應悲傷情緒。","雨後天晴使遷客騷人歡欣。","陰雨景象代表作者的政治得意。","霪雨指短暫晴朗的春日。"],
[8,"去國懷鄉，憂讒畏譏。","遷客騷人的悲情","離開京城、懷念故鄉並憂讒畏譏，具體呈現失意者觸景而悲。","登樓者因升官而急於回鄉。","悲情只源自樓高，與身世無關。","作者主張遭貶者不應思念家鄉。"],
[8,"至若春和景明，波瀾不驚，上下天光，一碧萬頃。","晴明景與喜","春和景明、天水一色，描寫晴朗開闊的景色，帶出喜洋洋的感受。","晴景寫出戰亂中百姓恐懼。","此段與前文陰雨景色完全相同。","景明指光線昏暗、視野受阻。"],
[8,"不以物喜，不以己悲。","不因境遇而悲喜","古仁人不因外物或個人得失而改變心志，超越遷客騷人的情緒起伏。","人應忽略一切公共事務和個人責任。","只要景色愉快便應歡喜，無須考慮其他。","作者認為悲喜只由天氣決定。"],
[8,"居廟堂之高則憂其民；處江湖之遠則憂其君。","進退皆憂","身居朝廷憂百姓，退處江湖仍憂君主，呈現古仁人的責任感。","古仁人只在朝廷任職時關心百姓。","離開朝廷便不再關心國家。","此句勸人以個人安逸取代公共責任。"],

:["孔子正是從言語工夫切入談仁，並非無關。","把「慎言」誇大為愈少愈好，非孔子本意。","誤把「訒」（言語遲鈍謹慎）解作口吃。","正確。據《史記》，司馬牛「多言而躁」，孔子教其出言遲鈍謹慎；因行仁艱難，言論自當慎重，屬因材施教。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_005","sourceId":"005","origin":"attachment","chapter":"《論仁論孝論君子》","difficulty":"basic","type":"mc","quote":"子夏問孝。子曰：「色難。有事，弟子服其勞；有酒食，先生饌，曾是以為孝乎？」","question":"子夏問孝，孔子答「色難」，意思是甚麼？","options":["侍奉父母時常保和顏悅色最難做到","分辨顏色十分困難","父母的臉色難以捉摸","孝順與容貌無關"],"answerIndex":0,"explanation":"「色難」指子女侍奉父母時，長期保持和悅的容色最為困難；僅代勞、讓食而無敬愛之色，不足為孝。","distractorAnalysis":["正確。「色難」指子女侍奉父母時，長期保持和悅的容色最為困難；僅代勞、讓食而無敬愛之色，不足為孝。","誤解為辨識顏色。","誤把「色」解作父母的臉色。","曲解文意，孔子強調的正是發自內心的和悅神色。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_006","sourceId":"006","origin":"attachment","chapter":"《論仁論孝論君子》","difficulty":"advanced","type":"mc","quote":"子曰：「君子坦蕩蕩，小人長戚戚。」","question":"「君子坦蕩蕩，小人長戚戚」主要運用了甚麼修辭手法？","options":["雙關","借代","對比","誇張"],"answerIndex":2,"explanation":"君子與小人、坦蕩與戚戚兩兩對照，突顯二者心境之別，是典型的對比手法。","distractorAnalysis":["字面直述，並無雙關。","句中直陳君子小人，並無借代。","正確。君子與小人、坦蕩與戚戚兩兩對照，突顯二者心境之別，是典型的對比手法。","句意平實，並無誇大成分。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_007","sourceId":"007","origin":"attachment","chapter":"《論仁論孝論君子》","difficulty":"top","type":"mc","quote":"子曰：「君子和而不同，小人同而不和。」","question":"「君子和而不同，小人同而不和」的深意是甚麼？","options":["君子的意見永遠一致","君子排斥一切異見","君子喜歡和平，小人喜歡爭鬥","君子以道義相協而不盲從，小人表面附和而各懷私心"],"answerIndex":3,"explanation":"「和」是不同觀點以道義協調，「同」是無原則的苟同。君子和衷共濟而不失己見，小人曲意附和而終不和諧。","distractorAnalysis":["把「和」誤作完全一致。","與「和而不同」恰好相反。","只取字面，未明「和」「同」之別。","正確。「和」是不同觀點以道義協調，「同」是無原則的苟同。君子和衷共濟而不失己見，小人曲意附和而終不和諧。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_008","sourceId":"008","origin":"attachment","chapter":"《論仁論孝論君子》","difficulty":"basic","type":"mc","quote":"子曰：「不患人之不己知，患不知人也。」","question":"「不患人之不己知，患不知人也」中「患」的意思是甚麼？","options":["疾病","憂慮、擔心","仇恨","災禍"],"answerIndex":1,"explanation":"「患」解作憂慮、擔心。全句謂不必憂慮別人不了解自己，應憂慮自己不了解別人。","distractorAnalysis":["以名詞義「病患」誤解動詞。","正確。「患」解作憂慮、擔心。全句謂不必憂慮別人不了解自己，應憂慮自己不了解別人。","於文無據。","誤解為災患。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_009","sourceId":"009","origin":"attachment","chapter":"《論仁論孝論君子》","difficulty":"advanced","type":"mc","quote":"樊遲曰：「何謂也？」子曰：「生，事之以禮；死，葬之以禮，祭之以禮。」","question":"孔子答孟懿子問孝曰「無違」，後來對樊遲解釋「無違」的意思是？","options":["生時依禮侍奉，死後依禮安葬祭祀","不違背君王的意旨","不違背父母的任何命令","不違背自己的良心"],"answerIndex":0,"explanation":"「無違」是無違於禮：父母在世時依禮侍奉，去世後依禮安葬、祭祀，並非盲目順從父母。","distractorAnalysis":["正確。「無違」是無違於禮：父母在世時依禮侍奉，去世後依禮安葬、祭祀，並非盲目順從父母。","張冠李戴，孔子論的是孝而非事君。","把「無違」誤解為絕對服從，忽略「以禮」的限制。","以今人觀念曲解古義。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_010","sourceId":"010","origin":"attachment","chapter":"《論仁論孝論君子》","difficulty":"top","type":"mc","quote":"顏淵問仁。子曰：「克己復禮為仁。」……仲弓問仁。子曰：「……己所不欲，勿施於人。」","question":"下列何者最能概括孔子論「仁」的實踐工夫？","options":["克己復禮、推己及人、謹言慎行","博學多聞、能言善辯","建功立業、名揚天下","隱居避世、獨善其身"],"answerIndex":0,"explanation":"孔子論仁以「克己復禮」為綱，具體工夫包括「非禮勿視聽言動」的自我約束、「己所不欲，勿施於人」的推己及人，以及「其言也訒」的謹言慎行。","distractorAnalysis":["正確。孔子論仁以「克己復禮」為綱，具體工夫包括「非禮勿視聽言動」的自我約束、「己所不欲，勿施於人」的推己及人，以及「其言也訒」的謹言慎行。","學問言語並非仁的核心工夫。","事功聲名屬外在層面，非孔子論仁重點。","與孔子積極入世的精神相反。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_011","sourceId":"011","origin":"attachment","chapter":"《論仁論孝論君子》","difficulty":"basic","type":"mc","quote":"子曰：「君子不重則不威，學則不固。主忠信。無友不如己者。過則勿憚改。」","question":"「無友不如己者」最合理的解釋是？","options":["朋友必須比自己聰明","不要結交任何朋友","不要結交道德修養不如自己的人","不要和比自己貧窮的人交朋友"],"answerIndex":2,"explanation":"「不如己」指忠信德行不及己者；擇友以道義為準，而非以才學、財富論高低。","distractorAnalysis":["誤以才智論交友。","極端曲解，孔子從不主張不交友。","正確。「不如己」指忠信德行不及己者；擇友以道義為準，而非以才學、財富論高低。","誤以貧富論交友，非孔子本意。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_012","sourceId":"012","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"advanced","type":"mc","quote":"魚，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍魚而取熊掌者也。生，亦我所欲也；義，亦我所欲也。二者不可得兼，舍生而取義者也。","question":"孟子以「魚」與「熊掌」比喻甚麼？","options":["欲望與滿足","生命與道義","個人與家國","財富與權力"],"answerIndex":1,"explanation":"孟子以魚、熊掌不可兼得為喻，引出「生」與「義」的抉擇，說明當生命與道義衝突時應「舍生而取義」。","distractorAnalysis":["「欲望與滿足」過於抽象，未能點出「義」的核心。","正確。孟子以魚、熊掌不可兼得為喻，引出「生」與「義」的抉擇，說明當生命與道義衝突時應「舍生而取義」。","個人與家國之辨並非本段論旨。","本文論證落在生命與道義的抉擇，並非財富權力。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_013","sourceId":"013","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"top","type":"mc","quote":"萬鍾則不辨禮義而受之，萬鍾於我何加焉？……此之謂失其本心。","question":"「萬鍾則不辨禮義而受之，萬鍾於我何加焉」所批判的是哪種人？","options":["為厚祿而拋棄禮義、喪失本心的人","拒絕朝廷俸祿的清高隱士","橫徵暴斂的貪官污吏","不事生產的乞丐"],"answerIndex":0,"explanation":"孟子以反問指出，若因萬鍾厚祿而不辨禮義地接受，於己並無益處，痛斥見利忘義者喪失了羞惡的本心。","distractorAnalysis":["正確。孟子以反問指出，若因萬鍾厚祿而不辨禮義地接受，於己並無益處，痛斥見利忘義者喪失了羞惡的本心。","恰好相反：孟子批判的是受祿而不辨禮義者。","文中批判對象是「受萬鍾」的人，並非收稅者。","與「萬鍾」的厚祿語境不合。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_014","sourceId":"014","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"basic","type":"mc","quote":"一簞食，一豆羹，得之則生，弗得則死。嘑爾而與之，行道之人弗受；蹴爾而與之，乞人不屑也。","question":"「蹴爾而與之」中「蹴」的意思是甚麼？","options":["恭敬奉上","匆匆忙忙","用腳踢","大聲呼喝"],"answerIndex":2,"explanation":"「蹴」即用腳踐踏。「蹴爾而與之」指以腳踢過去施捨，態度極度輕蔑，故乞人亦不屑接受。","distractorAnalysis":["與文意恰好相反。","於文無據。","正確。「蹴」即用腳踐踏。「蹴爾而與之」指以腳踢過去施捨，態度極度輕蔑，故乞人亦不屑接受。","混淆「嘑爾而與之」的「嘑」（呼喝）。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_015","sourceId":"015","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"basic","type":"mc","quote":"萬鍾則不辨禮義而受之，萬鍾於我何加焉？","question":"「萬鍾於我何加焉」中「加」的意思是甚麼？","options":["施加","更加","增加","益處"],"answerIndex":3,"explanation":"「何加」即有何益處。「加」在此解作增益、益處：不辨禮義而接受厚祿，於我有何益處？","distractorAnalysis":["混淆「加諸於人」的「加」。","誤作副詞「更加」。","以字面今義「增加」誤解。","正確。「何加」即有何益處。「加」在此解作增益、益處：不辨禮義而接受厚祿，於我有何益處？"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_016","sourceId":"016","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"advanced","type":"mc","quote":"二者不可得兼，舍魚而取熊掌者也。……二者不可得兼，舍生而取義者也。","question":"孟子以「魚與熊掌」設喻的用意是甚麼？","options":["以具體取捨帶出「舍生取義」的抽象抉擇","證明欲望不可兼得","說明熊掌比魚美味可口","勸人節制飲食欲望"],"answerIndex":0,"explanation":"由人所共知的食物取捨，類比到生與義的抉擇，使「舍生取義」的抽象道理具體易明。","distractorAnalysis":["正確。由人所共知的食物取捨，類比到生與義的抉擇，使「舍生取義」的抽象道理具體易明。","顛倒主從：喻體是為本體服務的。","只取字面，未明比喻目的。","過度引申，偏離論旨。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_017","sourceId":"017","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"advanced","type":"mc","quote":"非獨賢者有是心也，人皆有之，賢者能勿喪耳。","question":"「非獨賢者有是心也，人皆有之」中「是心」指甚麼？","options":["貪生怕死之心","羞惡之心","憐憫之心","慕富貴之心"],"answerIndex":1,"explanation":"「是心」承接上文，指寧死不吃嗟來之食的羞惡之心；孟子認為這是人固有的善端，賢者不過能保有而已。","distractorAnalysis":["與文意相反。","正確。「是心」承接上文，指寧死不吃嗟來之食的羞惡之心；孟子認為這是人固有的善端，賢者不過能保有而已。","混淆「惻隱之心」，文中強調的是羞惡。","恰是「失其本心」的表現。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_018","sourceId":"018","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"top","type":"mc","quote":"是亦不可以已乎？此之謂失其本心。","question":"孟子批評「萬鍾則不辨禮義而受之」，其根本原因是甚麼？","options":["朝廷俸祿來歷不明","俸祿太少不值得接受","此舉使人喪失本心","接受俸祿有失身分"],"answerIndex":2,"explanation":"孟子認為為宮室之美、妻妾之奉、所識窮乏者得我而接受不義之祿，是捨義取利，喪失了固有的羞惡本心。","distractorAnalysis":["於文無據。","曲解「何加焉」為嫌俸祿少。","正確。孟子認為為宮室之美、妻妾之奉、所識窮乏者得我而接受不義之祿，是捨義取利，喪失了固有的羞惡本心。","文意無關身分高低。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_019","sourceId":"019","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"basic","type":"mc","quote":"生亦我所欲，所欲有甚於生者，故不為苟得也；死亦我所惡，所惡有甚於死者，故患有所不辟也。","question":"孟子對「生命」與「道義」關係的看法是？","options":["生命永遠高於一切","兩者可以並存而無衝突","義重於生，二者不可得兼時寧捨生取義","苟且偷生無可厚非"],"answerIndex":2,"explanation":"孟子承認生為人所欲，但所欲有甚於生者（義），故不苟得、不苟免，主張必要時舍生取義。","distractorAnalysis":["與「舍生取義」的主旨相反。","抹煞了取捨之間的張力。","正確。孟子承認生為人所欲，但所欲有甚於生者（義），故不苟得、不苟免，主張必要時舍生取義。","偏離文旨，孟子正批判苟得苟免。"],"marks":0,"rubric":[],"modelAnswer":"","diagnosis":"","commonMistakes":""},{"id":"src_mc_020","sourceId":"020","orig 心；把犬馬之喻誤解為「養父母如養犬馬」；未指出比喻與反問的論證作用","commonMistakes":"只引「能養」而遺漏「敬」的核心；把犬馬之喻誤解為「養父母如養犬馬」；未指出比喻與反問的論證作用"},{"id":"src_essay_002","sourceId":"002","origin":"attachment","chapter":"《論仁論孝論君子》","difficulty":"advanced","type":"essay","quote":"顏淵問仁。子曰：「克己復禮為仁。」……仲弓問仁。子曰：「……己所不欲，勿施於人。」……子曰：「仁者，其言也訒。」","question":"孔子答顏淵、仲弓、司馬牛三人問仁，答案各有不同。這反映了孔子怎樣的教學特色？試分別說明三人的答覆重點。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"顏淵：克己復禮","mark":1,"detail":"指出孔子教顏淵以「克己復禮」為仁，視聽言動皆合於禮。","keywords":[]},{"point":"仲弓：推己及人","mark":1,"detail":"指出教仲弓「出門如見大賓，使民如承大祭，己所不欲，勿施於人」。","keywords":[]},{"point":"司馬牛：謹言慎行","mark":1,"detail":"指出教司馬牛「仁者，其言也訒」，出言謹慎。","keywords":[]},{"point":"歸納：因材施教","mark":1,"detail":"歸納孔子針對不同弟子的性格與處境，給予不同的指引。","keywords":[]}],"modelAnswer":"孔子答顏淵以「克己復禮為仁」，教他克制私欲，使視聽言動皆合乎禮（1 分）；答仲弓以「出門如見大賓，使民如承大祭。己所不欲，勿施於人」，教他敬慎處事、推己及人（1 分）；答司馬牛以「仁者，其言也訒」，教他出言謹慎（1 分）。三人答案不同，反映孔子因材施教，能針對弟子不同的性格與處境給予相應指引（1 分）。","diagnosis":"把三人的答案互相混淆；只列答案而不點出「因材施教」的特色；未引原文，空泛作答","commonMistakes":"把三人的答案互相混淆；只列答案而不點出「因材施教」的特色；未引原文，空泛作答"},{"id":"src_essay_003","sourceId":"003","origin":"attachment","chapter":"《論仁論孝論君子》","difficulty":"advanced","type":"essay","quote":"生，事之以禮；死，葬之以禮，祭之以禮。……不敬，何以別乎？……色難。","question":"據《論仁論孝論君子》，孔子認為「孝」的實踐包含哪些層次？試引文說明。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"無違於禮","mark":1,"detail":"指出孝須依禮而行：「生，事之以禮；死，葬之以禮，祭之以禮」。","keywords":[]},{"point":"以敬為核心","mark":1,"detail":"指出「不敬，何以別乎」，恭敬之心是孝的根本。","keywords":[]},{"point":"和顏悅色","mark":1,"detail":"指出「色難」，侍奉父母須常保和悅容色。","keywords":[]},{"point":"免父母憂慮","mark":1,"detail":"指出「父母唯其疾之憂」，子女應自愛自持，不令父母憂慮。","keywords":[]}],"modelAnswer":"其一，孝須依禮而行：「生，事之以禮；死，葬之以禮，祭之以禮」（1 分）；其二，孝以「敬」為核心，若供養而無敬意，與飼養犬馬無別（1 分）；其三，孝須常保和顏悅色，故曰「色難」（1 分）；其四，子女應謹慎自持，除疾病外不令父母有其他憂慮（1 分）。","diagnosis":"只答「能養」一點，層次單薄；漏掉「色難」或「父母唯其疾之憂」的層次；不引原文，僅憑印象作答","commonMistakes":"只答「能養」一點，層次單薄；漏掉「色難」或「父母唯其疾之憂」的層次；不引原文，僅憑印象作答"},{"id":"src_essay_004","sourceId":"004","origin":"attachment","chapter":"《論仁論孝論君子》","difficulty":"top","type":"essay","quote":"子曰：「君子不憂不懼。」……「內省不疚，夫何憂何懼？」……「君子求諸己，小人求諸人。」","question":"有人說：「孔子論君子，重在內心修養而非外在事功。」試據選文舉例論證此說是否成立。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":5,"rubric":[{"point":"明確表態","mark":1,"detail":"清楚表示同意或反對，並總述立場。","keywords":[]},{"point":"引「不憂不懼」為證","mark":1,"detail":"引「內省不疚，夫何憂何懼」說明君子心安於內省。","keywords":[]},{"point":"引「君子求諸己」為證","mark":1,"detail":"引「君子求諸己」說明君子反求諸己的修養。","keywords":[]},{"point":"引「坦蕩蕩」為證","mark":1,"detail":"引「君子坦蕩蕩，小人長戚戚」對比君子心境。","keywords":[]},{"point":"歸結論證","mark":1,"detail":"歸結：君子之德由內而外，主忠信、過則勿憚改皆重內心。","keywords":[]}],"modelAnswer":"此說成立（1 分）。孔子論君子重內心修養：「內省不疚，夫何憂何懼」，君子因問心無愧而無憂無懼（1 分）；「君子求諸己，小人求諸人」，君子遇事反求諸己（1 分）；「君子坦蕩蕩」，心境光明磊落，與小人「長戚戚」對比（1 分）。凡此皆從內心修養立論，故君子之德由內而外，而非徒求外在事功（1 分）。","diagnosis":"只引文不表態，缺乏立場；舉例與論點脫節；未作歸結，結構不完整","commonMistakes":"只引文不表態，缺乏立場；舉例與論點脫節；未作歸結，結構不完整"},{"id":"src_essay_005","sourceId":"005","origin":"attachment","chapter":"《論仁論孝論君子》","difficulty":"advanced","type":"essay","quote":"仲弓問仁。子曰：「……己所不欲，勿施於人。在邦無怨，在家無怨。」","question":"「己所不欲，勿施於人」與「推己及人」有何關係？試說明其對今日人際相處的意義。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"解釋原句","mark":1,"detail":"解釋「自己不願承受的，不要加諸別人」。","keywords":[]},{"point":"說明推己及人","mark":1,"detail":"推己及人即以己之心度人之心、設身處地。","keywords":[]},{"point":"指出兩者關係","mark":1,"detail":"此句是推己及人的消極面（不施惡於人），與「己欲立而立人」的積極面互補。","keywords":[]},{"point":"今日意義","mark":1,"detail":"說明對今日人際相處的意義：尊重他人、減少衝突。","keywords":[]}],"modelAnswer":"「己所不欲，勿施於人」謂自己不願承受的事，不要加諸別人（1 分）。「推己及人」即以己之心度人之心，設身處地為人着想（1 分）。此句正是推己及人的消極面——不把惡事施於人，與「己欲立而立人」的積極面互補（1 分）。今日人際相處若能持此原則，懂得尊重他人感受、不以己之好惡強加於人，自可減少衝突、增進和諧（1 分）。","diagnosis":"只翻譯句子而不談「推己及人」的關係；忽略「消極面／積極面」的辨析；「今日意義」空泛，缺乏具體說明","commonMistakes":"只翻譯句子而不談「推己及人」的關係；忽略「消極面／積極面」的辨析；「今日意義」空泛，缺乏具體說明"},{"id":"src_essay_006","sourceId":"006","origin":"attachment","chapter":"《論仁論孝論君子》","difficulty":"top","type":"essay","quote":"子曰：「君子和而不同，小人同而不和。」","question":"比較「和而不同」與「同而不和」的分別，並說明君子與小人的本質差異。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"解釋「和而不同」","mark":1,"detail":"不同觀點以道義協調，包容差異而不盲從。","keywords":[]},{"point":"解釋「同而不和」","mark":1,"detail":"無原則的苟同，表面一致而內心各異。","keywords":[]},{"point":"君子本質","mark":1,"detail":"君子以道義相處，坦蕩磊落。","keywords":[]},{"point":"小人本質","mark":1,"detail":"小人以私利相結，各懷私心，終致不和。","keywords":[]}],"modelAnswer":"「和而不同」指君子能與人和諧相處，卻不盲從附和，而是以道義協調不同意見（1 分）；「同而不和」指小人無原則地苟同他人，表面一致，內心卻各懷私心（1 分）。可見君子以道義為依歸，坦蕩磊落（1 分）；小人以私利相結，貌合神離，終致不和（1 分）。","diagnosis":"把「和」等同於「同」；只譯句而不比較君子小人的本質；未扣「道義」與「私利」的分野","commonMistakes":"把「和」等同於「同」；只譯句而不比較君子小人的本質；未扣「道義」與「私利」的分野"},{"id":"src_essay_007","sourceId":"007","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"top","type":"essay","quote":"生，亦我所欲也；義，亦我所欲也。二者不可得兼，舍生而取義者也。","question":"孟子以甚麼手法論證「舍生取義」？又「本心」指甚麼？試據原文說明。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":5,"rubric":[{"point":"指出魚與熊掌之喻","mark":1,"detail":"以魚與熊掌不可兼得，比喻生與義的抉擇。","keywords":[]},{"point":"指出對比手法","mark":1,"detail":"說明「所欲有甚於生」「所惡有甚於死」，故不苟且偷生。","keywords":[]},{"point":"舉例論證","mark":1,"detail":"舉嘑爾、蹴爾之食，行道之人與乞人皆不屑接受。","keywords":[]},{"point":"說明「本心」的含義","mark":1,"detail":"本心指人天生的羞惡之心、向善的本性。","keywords":[]},{"point":"引「賢者能勿喪耳」作結","mark":1,"detail":"賢者能保持本心，見利忘義者則喪失本心。","keywords":[]}],"modelAnswer":"孟子先以魚與熊掌不可兼得為喻，引出「生」與「義」的抉擇，主張舍生取義（1 分）。再以對比說明人「所欲有甚於生者」、所惡有甚於死者，故不苟且偷生（1 分）。復舉例：嘑爾而與之、蹴爾而與之，行道之人與乞人皆不屑接受，可見羞惡之心人皆有之（1 分）。「本心」指人天生固有的羞惡之心、向善的本性（1 分）；「賢者能勿喪耳」，見利忘義者則「失其本心」（1 分）。","diagnosis":"只答「比喻」而不舉魚與熊掌之例；把「本心」誤解為後天培養的情感；遺漏「人皆有之，賢者能勿喪耳」的層次","commonMistakes":"只答「比喻」而不舉魚與熊掌之例；把「本心」誤解為後天培養的情感；遺漏「人皆有之，賢者能勿喪耳」的層次"},{"id":"src_essay_008","sourceId":"008","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"advanced","type":"essay","quote":"二者不可得兼，舍生而取義者也。……非獨賢者有是心也，人皆有之。","question":"孟子如何層層遞進地論證「舍生取義」？試簡述其論證步驟。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"設喻引入","mark":1,"detail":"以魚與熊掌不可得兼設喻，引出取捨問題。","keywords":[]},{"point":"正反論述","mark":1,"detail":"所欲有甚於生、所惡有甚於死，故不苟得、不苟免。","keywords":[]},{"point":"舉例論證","mark":1,"detail":"舉嘑爾、蹴爾之食，行道之人與乞人皆不受。","keywords":[]},{"point":"歸結本心","mark":1,"detail":"歸結「人皆有之，賢者能勿喪」，見利忘義則失其本心。","keywords":[]}],"modelAnswer":"孟子先以魚與熊掌不可得兼設喻，引出「生」與「義」的取捨（1 分）；繼而正反論述：所欲有甚於生、所惡有甚於死，故不苟得、不苟免（1 分）；再舉嘑爾、蹴爾之食，連瀕死的行道之人與乞人皆不屑接受，證明羞惡之心人皆有之（1 分）；最後歸結：賢者能勿喪本心，不辨禮義受萬鍾者則失其本心（1 分）。","diagnosis":"把論證步驟寫成內容複述；漏掉「設喻」或「歸結」一環；步驟之間缺乏「層層遞進」的說明","commonMistakes":"把論證步驟寫成內容複述；漏掉「設喻」或「歸結」一環；步驟之間缺乏「層層遞進」的說明"},{"id":"src_essay_009","sourceId":"009","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"top","type":"essay","quote":"非獨賢者有是心也，人皆有之，賢者能勿喪耳。……此之謂失其本心。","question":"「本心」在文中指甚麼？孟子認為「本心」與「義」的關係如何？試析述之。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":5,"rubric":[{"point":"解釋本心","mark":1,"detail":"本心指人固有的羞惡之心、向善的本性。","keywords":[]},{"point":"人皆有之","mark":1,"detail":"本心人皆有之，賢者不過能勿喪失。","keywords":[]},{"point":"本心為行義根據","mark":1,"detail":"義重於生的抉擇源自本心。","keywords":[]},{"point":"失本心之例","mark":1,"detail":"不辨禮義受萬鍾者即失其本心。","keywords":[]},{"point":"總結關係","mark":1,"detail":"總結：本心是行義的內在根據，守本心即守義。","keywords":[]}],"modelAnswer":"「本心」指人天生固有的羞惡之心、向善的本性（1 分）。孟子認為此心「人皆有之」，賢者不過能「勿喪」而已（1 分）。本心正是行義的內在根據：因有羞惡之心，人方能捨生取義（1 分）；反之，為萬鍾厚祿而不辨禮義受之，便是「失其本心」（1 分）。可見本心與義互為表裏，守本心即守義（1 分）。","diagnosis":"把「本心」誤解為後天培養的良心；只答本心含義而不論與「義」的關係；漏引「賢者能勿喪耳」或「失其本心」","commonMistakes":"把「本心」誤解為後天培養的良心；只答本心含義而不論與「義」的關係；漏引「賢者能勿喪耳」或「失其本心」"},{"id":"src_essay_010","sourceId":"010","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"advanced","type":"essay","quote":"生亦我所欲，所欲有甚於生者，故不為苟得也；死亦我所惡，所惡有甚於死者，故患有所不辟也。","question":"試從「所欲有甚於生者」與「所惡有甚於死者」兩句，說明孟子對生死的看法。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"生而不苟得","mark":1,"detail":"生是人所欲，但有比生更重要的東西，故不苟且求生。","keywords":[]},{"point":"死而不苟免","mark":1,"detail":"死是人所惡，但有比死更可惡的，故禍患當前亦不逃避。","keywords":[]},{"point":"甚於生者為義","mark":1,"detail":"所欲有甚於生者，即「義」。","keywords":[]},{"point":"甚於死者為不義","mark":1,"detail":"所惡有甚於死者，即「不義」。","keywords":[]}],"modelAnswer":"孟子承認生命是人所欲，但「所欲有甚於生者」，即道義，故不苟且求生（1 分）；死亡是人所惡，但「所惡有甚於死者」，即不義，故禍患當前亦不逃避（1 分）。可見孟子以「義」權衡生死：生當合乎義（1 分），與其不義而生，不如守義而死（1 分）。","diagnosis":"誤以為孟子輕視生命；未能點出「甚於生者」「甚於死者」分別指甚麼；漏掉「不苟得」「不苟免」的關鍵詞","commonMistakes":"誤以為孟子輕視生命；未能點出「甚於生者」「甚於死者」分別指甚麼；漏掉「不苟得」「不苟免」的關鍵詞"},{"id":"src_essay_011","sourceId":"011","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"top","type":"essay","quote":"魚，我所欲也；熊掌，亦我所欲也。……蹴爾而與之，乞人不屑也。","question":"孟子運用比喻與舉例兩種手法論證，試各舉一例並說明其效果。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"舉比喻之例","mark":1,"detail":"舉「魚與熊掌」之喻。","keywords":[]},{"point":"說明比喻效果","mark":1,"detail":"化抽象為具體，使取捨道理淺顯易明。","keywords":[]},{"point":"舉舉例之例","mark":1,"detail":"舉「一簞食，一豆羹」之事例。","keywords":[]},{"point":"說明舉例效果","mark":1,"detail":"以事實服人，貼近生活、親切有力。","keywords":[]}],"modelAnswer":"比喻之例：以「魚與熊掌不可得兼」喻「生與義不可得兼」（1 分），化抽象抉擇為具體取捨，道理淺顯易明（1 分）。舉例之例：舉「一簞食，一豆羹」，瀕死之人亦不食嗟來之食（1 分），以事實服人，貼近生活，論證親切有力（1 分）。","diagnosis":"比喻與舉例混淆不分；只舉例而不說明效果；引文與例證不符","commonMistakes":"比喻與舉例混淆不分；只舉例而不說明效果；引文與例證不符"},{"id":"src_essay_012","sourceId":"012","origin":"attachment","chapter":"《魚我所欲也》","difficulty":"advanced","type":"essay","quote":"生亦我所欲，所欲有甚於生者，故不為苟得也。","question":"有人說「孟子主張為了道義可以輕視生命」，你同意嗎？試據文意評述。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"明確表態","mark":1,"detail":"明確表示同意與否並總述理由。","keywords":[]},{"point":"孟子重義亦重生","mark":1,"detail":"指出孟子明言「生亦我所欲」，並非輕生。","keywords":[]},{"point":"取義的前提","mark":1,"detail":"舍生取義的前提是「二者不可得兼」。","keywords":[]},{"point":"權衡輕重","mark":1,"detail":"孟子是以義權衡生死之輕重，而非一概輕生。","keywords":[]}],"modelAnswer":"此說失之片面，我不盡同意（1 分）。孟子明言「生亦我所欲」，可見他並非輕視生命（1 分）；「舍生取義」的前提是生與義「不可得兼」，只在極端衝突時方須取捨（1 分）。孟子是以「義」權衡生死的輕重：平時當珍重生命，唯有守義與求生不可並存時，才捨生取義（1 分）。","diagnosis":"立場含糊，兩邊搖擺；忽略「不可得兼」的前提；把「捨生取義」誇大為隨時輕生","commonMistakes":"立場含糊，兩邊搖擺；忽略「不可得兼」的前提；把「捨生取義」誇大為隨時輕生"},{"id":"src_essay_013","sourceId":"013","origin":"attachment","chapter":"《逍遙遊》","difficulty":"top","type":"essay","quote":"故曰：至人無己，神人無功，聖人無名。","question":"莊子所嚮往的逍遙境界有何特點？怎樣才能達到？","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"指出逍遙即精神絕對自由","mark":1,"detail":"逍遙即精神的絕對自由，無所待於外物。","keywords":[]},{"point":"解釋「無己」","mark":1,"detail":"放下對自我的執著。","keywords":[]},{"point":"解釋「無功」","mark":1,"detail":"不追求事功。","keywords":[]},{"point":"解釋「無名」","mark":1,"detail":"不慕虛名。","keywords":[]}],"modelAnswer":"逍遙境界的特點是精神的絕對自由，不受外物與條件所限，即「無所待」（1 分）。要達至此境，須如「至人」般「無己」，放下對自我的執著（1 分）；如「神人」般「無功」，不追求事功（1 分）；如「聖人」般「無名」，不慕虛名（1 分），超越一切束縛而與道合一。","diagnosis":"把逍遙誤解為遊山玩水的閒適；把「無己」誤解為喪失自我；只列「無己、無功、無名」而不解釋其含義","commonMistakes":"把逍遙誤解為遊山玩水的閒適；把「無己」誤解為喪失自我；只列「無己、無功、無名」而不解釋其含義"},{"id":"src_essay_014","sourceId":"014","origin":"attachment","chapter":"《逍遙遊》","difficulty":"advanced","type":"essay","quote":"鵬之徙於南冥也，水擊三千里，摶扶搖而上者九萬里。……蜩與學鳩笑之曰：「奚以之九萬里而南為？」","question":"莊子寫鯤鵬與蜩鳩兩組形象，用意何在？試說明。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"鯤鵬形象","mark":1,"detail":"鯤鵬象徵志向遠大、境界高遠。","keywords":[]},{"point":"蜩鳩形象","mark":1,"detail":"蜩鳩象徵見識淺陋、自以為是。","keywords":[]},{"point":"對比手法","mark":1,"detail":"指出兩組形象構成對比。","keywords":[]},{"point":"說明道理","mark":1,"detail":"說明「小知不及大知」，見識受境界所限。","keywords":[]}],"modelAnswer":"鯤鵬形體巨大、高飛九萬里，象徵志向遠大、境界高遠（1 分）；蜩與學鳩滿足於榆枋之間，象徵見識淺陋、自以為是（1 分）。莊子以兩組形象構成對比（1 分），說明「小知不及大知」：見識淺陋者無法理解境界高遠者（1 分）。","diagnosis":"只描述形象而不點出象徵意義；未指出對比手法；未歸結「小知不及大知」的道理","commonMistakes":"只描述形象而不點出象徵意義；未指出對比手法；未歸結「小知不及大知」的道理"},{"id":"src_essay_015","sourceId":"015","origin":"attachment","chapter":"《逍遙遊》","difficulty":"top","type":"essay","quote":"若夫乘天地之正，而御六氣之辯，以遊無窮者，彼且惡乎待哉！……至人無己，神人無功，聖人無名。","question":"何謂「有待」與「無待」？莊子認為怎樣才能達至「無待」的逍遙？","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":5,"rubric":[{"point":"解釋有待","mark":1,"detail":"有待指依賴外在條件，如大鵬待風、列子御風。","keywords":[]},{"point":"解釋無待","mark":1,"detail":"無待指無所依恃的精神絕對自由。","keywords":[]},{"point":"乘天地之正","mark":1,"detail":"乘天地之正、御六氣之辯，順應自然。","keywords":[]},{"point":"無己無功無名","mark":1,"detail":"至人無己、神人無功、聖人無名。","keywords":[]},{"point":"歸結","mark":1,"detail":"歸結：放下自我與名利，與道合一，方能逍遙。","keywords":[]}],"modelAnswer":"「有待」指依賴外在條件，如大鵬高飛須待厚積之風、列子御風而行（1 分）；「無待」指無所依恃的精神絕對自由（1 分）。莊子認為須「乘天地之正，而御六氣之辯」，順應自然規律（1 分）；並如「至人無己，神人無功，聖人無名」般放下自我執念與名利追求（1 分），方能超越一切束縛，達至與道合一的逍遙境界（1 分）。","diagnosis":"把「有待」「無待」混為一談；漏掉「乘天地之正，御六氣之辯」一層；只列「無己無功無名」而不作歸結","commonMistakes":"把「有待」「無待」混為一談；漏掉「乘天地之正，御六氣之辯」一層；只列「無己無功無名」而不作歸結"},{"id":"src_essay_016","sourceId":"016","origin":"attachment","chapter":"《逍遙遊》","difficulty":"advanced","type":"essay","quote":"且夫水之積也不厚，則其負大舟也無力。……風之積也不厚，則其負大翼也無力。","question":"「水之積也不厚，則其負大舟也無力」與大鵬高飛有何關係？試說明莊子的論證。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"積水負舟之喻","mark":1,"detail":"先以積水負舟為喻。","keywords":[]},{"point":"類比積風負翼","mark":1,"detail":"類比「風之積也不厚，則其負大翼也無力」。","keywords":[]},{"point":"扣合大鵬高飛","mark":1,"detail":"大鵬九萬里高飛須待厚積之風。","keywords":[]},{"point":"歸結寓意","mark":1,"detail":"歸結：成大事者須先厚積條件。","keywords":[]}],"modelAnswer":"莊子先以積水負舟為喻：水積不厚，便無力負起大舟（1 分）；進而類比「風之積也不厚，則其負大翼也無力」（1 分）。大鵬能扶搖而上九萬里，正因有待於厚積之風（1 分）。由此歸結：萬事須條件充足、積累深厚，方能成就其大（1 分）。","diagnosis":"只譯句而不說明與大鵬的關係；漏掉「類比」的論證手法；未歸結寓意","commonMistakes":"只譯句而不說明與大鵬的關係；漏掉「類比」的論證手法；未歸結寓意"},{"id":"src_essay_017","sourceId":"017","origin":"attachment","chapter":"《逍遙遊》","difficulty":"top","type":"essay","quote":"彼其於世，未數數然也。雖然，猶有未樹也。……此雖免乎行，猶有所待者也。","question":"宋榮子「猶有未樹」、列子「猶有所待」，莊子對二人的評價反映了他怎樣的逍遙觀？","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"宋榮子之長","mark":1,"detail":"定乎內外之分、辯乎榮辱之境，超然於毀譽。","keywords":[]},{"point":"宋榮子之不足","mark":1,"detail":"猶有未樹：尚有未能樹立者。","keywords":[]},{"point":"列子之不足","mark":1,"detail":"列子御風而行，猶有所待於風。","keywords":[]},{"point":"歸結逍遙觀","mark":1,"detail":"歸結：唯有無己、無功、無名的無待之境，才是真逍遙。","keywords":[]}],"modelAnswer":"宋榮子能定乎內外之分、辯乎榮辱之境，不因毀譽而動心，可貴之極，但「猶有未樹」，尚有未能樹立者（1 分）；列子御風而行，輕快之至，但「猶有所待」，仍須依賴風（1 分）。莊子認為二人皆未達絕對自由（1 分），唯有「無己、無功、無名」、無所依待的境界，才是真正的逍遙（1 分）。","diagnosis":"把「未樹」「所待」混為一談；只述二人事跡而不析莊子的逍遙觀；未歸結「無待」才是逍遙之旨","commonMistakes":"把「未樹」「所待」混為一談；只述二人事跡而不析莊子的逍遙觀；未歸結「無待」才是逍遙之旨"},{"id":"src_essay_018","sourceId":"018","origin":"attachment","chapter":"《逍遙遊》","difficulty":"advanced","type":"essay","quote":"小知不及大知，小年不及大年。奚以知其然也？朝菌不知晦朔，蟪蛄不知春秋，此小年也。","question":"「小知不及大知，小年不及大年」如何運用對比與比喻說明道理？","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"指出對比","mark":1,"detail":"小知與大知、小年與大年兩組對比。","keywords":[]},{"point":"舉比喻之例","mark":1,"detail":"以朝菌、蟪蛄為喻。","keywords":[]},{"point":"說明道理","mark":1,"detail":"境界受制於所見所歷，壽命與見識有限則難知大道。","keywords":[]},{"point":"歸結","mark":1,"detail":"歸結：不可囿於一隅之見。","keywords":[]}],"modelAnswer":"莊子以「小知」與「大知」、「小年」與「大年」兩組概念對比立論（1 分）；再以「朝菌不知晦朔，蟪蛄不知春秋」為喻（1 分），說明生命短暫、見識有限者無法理解更廣大的世界（1 分）。由此歸結：人當開拓眼界，不可囿於一隅之見（1 分）。","diagnosis":"對比與比喻不分；只舉例而不說明道理；未歸結「不可囿於一隅」","commonMistakes":"對比與比喻不分；只舉例而不說明道理；未歸結「不可囿於一隅」"},{"id":"src_essay_019","sourceId":"019","origin":"attachment","chapter":"《勸學》","difficulty":"advanced","type":"essay","quote":"青，取之於藍，而青於藍；冰，水為之，而寒於水。","question":"《勸學》開首以甚麼比喻說明「學不可以已」？試舉出兩種，並說明其用意。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"舉「青出於藍」之喻","mark":1,"detail":"靛青由蓼藍提煉而出，顏色卻更深。","keywords":[]},{"point":"舉「冰寒於水」之喻","mark":1,"detail":"冰由水凝結而成，卻比水更寒。","keywords":[]},{"point":"說明兩喻的用意","mark":1,"detail":"說明學習可使人改造提升，超越本來資質。","keywords":[]},{"point":"歸結「學不可以已」","mark":1,"detail":"既然學習能提升自己，故學習不可停止。","keywords":[]}],"modelAnswer":"荀子以「青，取之於藍，而青於藍」為喻，靛青由蓼藍提煉而出，顏色卻比蓼藍更深（1 分）；又以「冰，水為之，而寒於水」為喻，冰由水凝結而成，卻比水更寒（1 分）。兩喻說明人可通過學習改造自己、提升資質，超越本來狀態（1 分），因此學習不可以停止（1 分）。","diagnosis":"只引比喻而不說明用意；把比喻引申為「學生勝過老師」；遺漏歸結「學不可以已」的主旨","commonMistakes":"只引比喻而不說明用意；把比喻引申為「學生勝過老師」；遺漏歸結「學不可以已」的主旨"},{"id":"src_essay_020","sourceId":"020","origin":"attachment","chapter":"《勸學》","difficulty":"advanced","type":"essay","quote":"青，取之於藍，而青於藍；冰，水為之，而寒於水。……不積跬步，無以至千里。","question":"荀子從哪些方面論證「學不可以已」？試舉其中兩種並說明。","options":[],"answerIndex ,{"point":"愛其子與於其身","mark":1,"detail":"愛其子擇師而教 vs 於其身則恥師。","keywords":[]},{"point":"百工與士大夫","mark":1,"detail":"巫醫百工不恥相師 vs 士大夫羣聚而笑。","keywords":[]},{"point":"小學而大遺","mark":1,"detail":"點出「小學而大遺」的荒謬。","keywords":[]},{"point":"效果","mark":1,"detail":"層層對比，師道不傳之弊畢露。","keywords":[]}],"modelAnswer":"韓愈連設三組對比：其一，古之聖人猶且從師，今之眾人卻恥學於師（1 分）；其二，士大夫愛其子則「擇師而教之」，於其身則「恥師焉」（1 分）；其三，巫醫樂師百工之人不恥相師，士大夫之族卻「羣聚而笑之」（1 分）。並以「小學而大遺」點出本末倒置的荒謬（1 分）。層層對比之下，師道不傳之弊昭然若揭（1 分）。","diagnosis":"對比組數不足；各組對比內容張冠李戴；未點出對比的論證效果","commonMistakes":"對比組數不足；各組對比內容張冠李戴；未點出對比的論證效果"},{"id":"src_essay_040","sourceId":"040","origin":"attachment","chapter":"《師說》","difficulty":"advanced","type":"essay","quote":"是故無貴無賤，無長無少，道之所存，師之所存也。","question":"韓愈如何反駁「位卑則足羞，官盛則近諛」的從師顧慮？","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"指出士大夫之語","mark":1,"detail":"先引士大夫「位卑則足羞，官盛則近諛」之說。","keywords":[]},{"point":"以道為準","mark":1,"detail":"以「無貴無賤，無長無少」破地位年齡之見。","keywords":[]},{"point":"聖人無常師","mark":1,"detail":"舉聖人無常師、孔子師郯子等為證。","keywords":[]},{"point":"歸結","mark":1,"detail":"歸結：聞道有先後、術業有專攻，不必計較地位。","keywords":[]}],"modelAnswer":"韓愈先引出士大夫的顧慮：「位卑則足羞，官盛則近諛」（1 分）；繼而以「是故無貴無賤，無長無少，道之所存，師之所存也」正面立論，指出擇師只問其道，不問地位年齡（1 分）；再舉「聖人無常師」，孔子尚且師郯子、萇弘、師襄、老聃為證（1 分）；最後歸結「聞道有先後，術業有專攻」，故從師不必計較對方地位（1 分）。","diagnosis":"漏掉「聖人無常師」的例證；未點出「以道為準」的立論；反駁與立論不分","commonMistakes":"漏掉「聖人無常師」的例證；未點出「以道為準」的立論；反駁與立論不分"},{"id":"src_essay_041","sourceId":"041","origin":"attachment","chapter":"《師說》","difficulty":"advanced","type":"essay","quote":"是故弟子不必不如師，師不必賢於弟子，聞道有先後，術業有專攻，如是而已。","question":"「弟子不必不如師，師不必賢於弟子」如何體現韓愈的師道觀？","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"解釋句意","mark":1,"detail":"弟子未必不如師，師未必賢於弟子。","keywords":[]},{"point":"說明原因","mark":1,"detail":"聞道有先後，術業有專攻。","keywords":[]},{"point":"破除成見","mark":1,"detail":"打破以賢愚、資歷論師的成見。","keywords":[]},{"point":"歸結師道","mark":1,"detail":"歸結：師道核心在「道」而非身分。","keywords":[]}],"modelAnswer":"韓愈認為弟子未必不如老師，老師也未必賢於弟子（1 分），因為「聞道有先後，術業有專攻」，人各有所長（1 分）。此說打破了以賢愚、資歷論師的世俗成見（1 分），歸結出師道的核心在「道」之所在，而非身分地位（1 分）。","diagnosis":"只譯句而不析師道觀；漏掉「聞道有先後，術業有專攻」的原因；未點出「破除成見」的意義","commonMistakes":"只譯句而不析師道觀；漏掉「聞道有先後，術業有專攻」的原因；未點出「破除成見」的意義"},{"id":"src_essay_042","sourceId":"042","origin":"attachment","chapter":"《師說》","difficulty":"top","type":"essay","quote":"今之眾人，其下聖人也亦遠矣，而恥學於師。……位卑則足羞，官盛則近諛。","question":"《師說》名為「說」，其實是一篇駁論。韓愈駁斥了哪些世俗觀點？試簡述。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"駁恥學於師","mark":1,"detail":"駁「恥學於師」的風氣。","keywords":[]},{"point":"駁以地位論師","mark":1,"detail":"駁「位卑則足羞，官盛則近諛」。","keywords":[]},{"point":"駁以年歲論師","mark":1,"detail":"駁「年相若、道相似」的藉口。","keywords":[]},{"point":"正面立論","mark":1,"detail":"正面立論：道之所存，師之所存。","keywords":[]}],"modelAnswer":"韓愈駁斥了三種世俗觀點：其一，駁「恥學於師」的風氣，指今之眾人下聖人遠矣卻恥於從師（1 分）；其二，駁「位卑則足羞，官盛則近諛」的勢利之見（1 分）；其三，駁「彼與彼年相若也，道相似也」的藉口（1 分）。破中有立，最後正面立論：「道之所存，師之所存也」（1 分）。","diagnosis":"只立不破，忽略「駁論」性質；漏掉「年相若」的藉口；未點出「破中有立」","commonMistakes":"只立不破，忽略「駁論」性質；漏掉「年相若」的藉口；未點出「破中有立」"},{"id":"src_essay_043","sourceId":"043","origin":"attachment","chapter":"《始得西山宴遊記》","difficulty":"advanced","type":"essay","quote":"心凝形釋，與萬化冥合。然後知吾嚮之未始游，游於是乎始，故為之文以志。","question":"柳宗元為何說西山之遊是「游於是乎始」？西山之遊帶給他甚麼？","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"比較前此之遊","mark":1,"detail":"此前出遊只為排遣貶謫憂懼，未得山水真趣。","keywords":[]},{"point":"西山之景特立超然","mark":1,"detail":"登西山見其特立不群，始領略「西山之怪特」。","keywords":[]},{"point":"「心凝形釋，與萬化冥合」","mark":1,"detail":"精神與自然萬物融為一體。","keywords":[]},{"point":"歸結境界提升","mark":1,"detail":"貶謫苦悶得到超脫，境界始開。","keywords":[]}],"modelAnswer":"此前柳宗元貶居永州，恆惴慄不安，出遊不過「施施而行，漫漫而游」，借山水排遣憂懼，未得真趣（1 分）。登西山後，見其特立不群的氣勢，始領略「西山之怪特」（1 分）。他「心凝形釋，與萬化冥合」，精神與自然萬物融為一體（1 分），貶謫的苦悶得到超脫，境界始開，故曰「游於是乎始」（1 分）。","diagnosis":"誤以為西山是作者第一次遊山；未比較前後之遊的差異；漏引「心凝形釋，與萬化冥合」；忽略作者貶謫的背景","commonMistakes":"誤以為西山是作者第一次遊山；未比較前後之遊的差異；漏引「心凝形釋，與萬化冥合」；忽略作者貶謫的背景"},{"id":"src_essay_044","sourceId":"044","origin":"attachment","chapter":"《始得西山宴遊記》","difficulty":"advanced","type":"essay","quote":"自余為僇人，居是州，恆惴慄。……心凝形釋，與萬化冥合。","question":"柳宗元描寫西山前後，心境有何轉變？試引文說明。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"遊前心境","mark":1,"detail":"「自余為僇人，居是州，恆惴慄」，貶謫中惴慄不安。","keywords":[]},{"point":"前此之遊","mark":1,"detail":"「施施而行，漫漫而游」，借遊山醉酒排遣。","keywords":[]},{"point":"登西山後","mark":1,"detail":"「心凝形釋，與萬化冥合」，精神與自然合一。","keywords":[]},{"point":"歸結轉變","mark":1,"detail":"歸結：苦悶暫解、境界始開。","keywords":[]}],"modelAnswer":"遊西山前，作者因貶謫「恆惴慄」，心懷憂懼（1 分）；此前出遊不過「施施而行，漫漫而游」，借醉酒排遣苦悶（1 分）。登西山後，他「心凝形釋，與萬化冥合」，精神與自然萬物融為一體（1 分），貶謫的苦悶暫得解脫，境界煥然一新（1 分）。","diagnosis":"只寫登西山後而不交代遊前心境；漏引「恆惴慄」的背景；未點出「排遣」與「超脫」之別","commonMistakes":"只寫登西山後而不交代遊前心境；漏引「恆惴慄」的背景；未點出「排遣」與「超脫」之別"},{"id":"src_essay_045","sourceId":"045","origin":"attachment","chapter":"《始得西山宴遊記》","difficulty":"advanced","type":"essay","quote":"則凡數州之土壤，皆在衽席之下。其高下之勢，岈然洼然，若垤若穴，尺寸千里。","question":"作者如何從多個角度描寫西山之高峻特立？試舉例說明。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"俯瞰角度","mark":1,"detail":"「凡數州之土壤，皆在衽席之下」，居高臨下。","keywords":[]},{"point":"形勢角度","mark":1,"detail":"「岈然洼然，若垤若穴」，高下起伏如垤穴。","keywords":[]},{"point":"遠景角度","mark":1,"detail":"「縈青繚白，外與天際，四望如一」，遠景與天相接。","keywords":[]},{"point":"對比襯托","mark":1,"detail":"「不與培塿為類」，以眾山反襯西山特立。","keywords":[]}],"modelAnswer":"作者先從俯瞰角度寫「凡數州之土壤，皆在衽席之下」，極言其高（1 分）；再從形勢角度寫「岈然洼然，若垤若穴」，眾山高下起伏盡收眼底（1 分）；又從遠景角度寫「縈青繚白，外與天際，四望如一」（1 分）；最後以「不與培塿為類」對比襯托西山的特立不群（1 分）。","diagnosis":"角度單一，只寫高；舉例與角度不配；漏掉「不與培塿為類」的襯托","commonMistakes":"角度單一，只寫高；舉例與角度不配；漏掉「不與培塿為類」的襯托"},{"id":"src_essay_046","sourceId":"046","origin":"attachment","chapter":"《始得西山宴遊記》","difficulty":"top","type":"essay","quote":"而未始知西山之怪特。……然後知吾嚮之未始游，游於是乎始，故為之文以志。","question":"「始得」二字在全文結構上有何作用？試析述之。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":5,"rubric":[{"point":"點題","mark":1,"detail":"篇名「始得」點題，先寫「未始知西山之怪特」。","keywords":[]},{"point":"鋪墊","mark":1,"detail":"前此之遊「未始游」，為「始得」作鋪墊。","keywords":[]},{"point":"轉折","mark":1,"detail":"望西山、登西山為全文轉折。","keywords":[]},{"point":"昇華","mark":1,"detail":"「游於是乎始」，境界昇華。","keywords":[]},{"point":"收結","mark":1,"detail":"「故為之文以志」，收結全文。","keywords":[]}],"modelAnswer":"「始得」是全文的結構樞紐：開篇寫「未始知西山之怪特」，反點題意（1 分）；中間鋪敘前此之遊，皆「未始游」的排遣之遊（1 分）；繼而「因坐法華西亭，望西山，始指異之」，引出登覽的轉折（1 分）；登西山後「心凝形釋，與萬化冥合」，方知「游於是乎始」，境界昇華（1 分）；最後「故為之文以志」收結，首尾呼應（1 分）。","diagnosis":"把「始得」只解作「第一次得到」；結構層次混亂；未點出「鋪墊—轉折—昇華」的脈絡","commonMistakes":"把「始得」只解作「第一次得到」；結構層次混亂；未點出「鋪墊—轉折—昇華」的脈絡"},{"id":"src_essay_047","sourceId":"047","origin":"attachment","chapter":"《始得西山宴遊記》","difficulty":"top","type":"essay","quote":"蒼然暮色，自遠而至，至無所見，而猶不欲歸。心凝形釋，與萬化冥合。","question":"「心凝形釋，與萬化冥合」如何體現道家「物我合一」的思想？","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"解釋句意","mark":1,"detail":"心神凝聚、形體似釋，與萬物冥合。","keywords":[]},{"point":"物我界限消融","mark":1,"detail":"主客對立消失，物我兩忘。","keywords":[]},{"point":"與自然一體","mark":1,"detail":"與自然萬物融為一體，正是道家境界。","keywords":[]},{"point":"聯繫背景","mark":1,"detail":"聯繫貶謫背景：精神由此得到解脫。","keywords":[]}],"modelAnswer":"「心凝形釋，與萬化冥合」謂心神凝聚而形體似釋，與自然萬物冥然合一（1 分）。此時主客對立消失，物我界限消融（1 分），人與自然融為一體，正是道家追求的「物我合一」境界（1 分）。聯繫柳宗元貶謫永州、恆惴慄的背景，這種體驗使他的精神得到暫時的解脫（1 分）。","diagnosis":"只譯句而不扣「物我合一」；未聯繫道家思想；忽略貶謫背景的解脫意義","commonMistakes":"只譯句而不扣「物我合一」；未聯繫道家思想；忽略貶謫背景的解脫意義"},{"id":"src_essay_048","sourceId":"048","origin":"attachment","chapter":"《始得西山宴遊記》","difficulty":"advanced","type":"essay","quote":"自余為僇人，居是州，恆惴慄。……然後知是山之特立，不與培塿為類。","question":"有人說《始得西山宴遊記》「記遊是表，抒懷是裏」，你同意嗎？試說明。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"明確表態","mark":1,"detail":"明確表示同意與否。","keywords":[]},{"point":"記遊之表","mark":1,"detail":"指出文章表面記登西山所見。","keywords":[]},{"point":"抒懷之裏","mark":1,"detail":"內裏抒發貶謫惴慄之情。","keywords":[]},{"point":"寄託","mark":1,"detail":"以西山特立寄託不隨流俗的人格。","keywords":[]}],"modelAnswer":"我同意此說（1 分）。文章表面是記遊：記敘登西山之所見，如「凡數州之土壤，皆在衽席之下」（1 分）；內裏則是抒懷：開篇「自余為僇人，居是州，恆惴慄」，暗寫貶謫的憂懼（1 分）；更以「是山之特立，不與培塿為類」寄託自己不隨流俗的高潔人格（1 分）。故「記遊是表，抒懷是裏」一語中的。","diagnosis":"立場含糊；只述記遊內容而不析抒懷；未點出「特立」的人格寄託","commonMistakes":"立場含糊；只述記遊內容而不析抒懷；未點出「特立」的人格寄託"},{"id":"src_essay_049","sourceId":"049","origin":"attachment","chapter":"《岳陽樓記》","difficulty":"top","type":"essay","quote":"居廟堂之高，則憂其民；處江湖之遠，則憂其君。是進亦憂，退亦憂。","question":"「先天下之憂而憂，後天下之樂而樂」如何體現儒家的民本思想？試析述之。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":5,"rubric":[{"point":"超越個人得失","mark":1,"detail":"「不以物喜，不以己悲」，不囿於個人得失。","keywords":[]},{"point":"進退皆憂國憂民","mark":1,"detail":"居廟堂憂其民，處江湖憂其君。","keywords":[]},{"point":"憂樂以天下為先","mark":1,"detail":"憂樂先後繫於天下蒼生，置百姓於個人之先。","keywords":[]},{"point":"聯繫儒家濟世傳統","mark":1,"detail":"體現儒家「仁」的精神與以天下為己任的民本思想。","keywords":[]},{"point":"與遷客騷人對比","mark":1,"detail":"遷客騷人囿於個人悲喜，反襯古仁人之心。","keywords":[]}],"modelAnswer":"「先憂後樂」以「不以物喜，不以己悲」為前提，超越個人得失（1 分）。作者無論「居廟堂之高」或「處江湖之遠」，皆憂國憂民，進亦憂、退亦憂（1 分）。他把憂樂的先後繫於天下蒼生，將百姓置於個人之前（1 分）。這正是儒家「仁」的精神與士大夫以天下為己任的濟世傳統（1 分），並與遷客騷人囿於個人悲喜形成對比，突出古仁人之心（1 分）。","diagnosis":"只複述名句而不分析「進亦憂，退亦憂」的層次；未聯繫儒家思想；忽略與遷客騷人的對比","commonMistakes":"只複述名句而不分析「進亦憂，退亦憂」的層次；未聯繫儒家思想；忽略與遷客騷人的對比"},{"id":"src_essay_050","sourceId":"050","origin":"attachment","chapter":"《岳陽樓記》","difficulty":"advanced","type":"essay","quote":"登斯樓也，則有去國懷鄉，憂讒畏譏，滿目蕭然，感極而悲者矣。……不以物喜，不以己悲。","question":"遷客騷人的「悲」「喜」與古仁人的境界有何不同？試對比說明。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"遷客之悲","mark":1,"detail":"陰雨蕭瑟之景，觸發去國懷鄉之悲。","keywords":[]},{"point":"遷客之喜","mark":1,"detail":"春和景明之景，觸發心曠神怡之喜。","keywords":[]},{"point":"遷客之局限","mark":1,"detail":"以物喜、以己悲，囿於個人際遇。","keywords":[]},{"point":"古仁人之境界","mark":1,"detail":"不以物喜、不以己悲，超越個人得失。","keywords":[]}],"modelAnswer":"遷客騷人的悲喜皆因景物而發：陰雨蕭瑟則「感極而悲」（1 分），春和景明則「其喜洋洋」（1 分），是「以物喜、以己悲」，囿於個人際遇（1 分）。古仁人則「不以物喜，不以己悲」，超越景物與個人得失，以天下憂樂為懷，境界遠在其上（1 分）。","diagnosis":"只寫遷客悲喜而不與古仁人對比；漏掉「以物喜、以己悲」的癥結；未點出古仁人境界之所在","commonMistakes":"只寫遷客悲喜而不與古仁人對比；漏掉「以物喜、以己悲」的癥結；未點出古仁人境界之所在"},{"id":"src_essay_051","sourceId":"051","origin":"attachment","chapter":"《岳陽樓記》","difficulty":"top","type":"essay","quote":"不以物喜，不以己悲。……先天下之憂而憂，後天下之樂而樂。","question":"「先天下之憂而憂，後天下之樂而樂」與「不以物喜，不以己悲」有何邏輯關係？","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":5,"rubric":[{"point":"解釋兩句","mark":1,"detail":"分別解釋兩句含義。","keywords":[]},{"point":"前提","mark":1,"detail":"「不以物喜，不以己悲」是先憂後樂的前提。","keywords":[]},{"point":"超越個人","mark":1,"detail":"超越個人得失方能心繫天下。","keywords":[]},{"point":"歸宿","mark":1,"detail":"先憂後樂是修養的歸宿。","keywords":[]},{"point":"歸結","mark":1,"detail":"歸結：修養→襟懷，一體相承。","keywords":[]}],"modelAnswer":"「不以物喜，不以己悲」謂不因外物好壞與個人得失而悲喜（1 分）；「先天下之憂而憂，後天下之樂而樂」謂憂樂以天下為先後（1 分）。前者是後者的前提：唯有超越個人得失，方能心繫天下（1 分）；後者是前者的歸宿：修養最終落實為「先憂後樂」的襟懷（1 分）。二者一體相承，由修養而襟懷，層層遞進（1 分）。","diagnosis":"只分釋兩句而不析關係；未點出「前提—歸宿」的邏輯；漏掉「超越個人得失」的中介一環","commonMistakes":"只分釋兩句而不析關係；未點出「前提—歸宿」的邏輯；漏掉「超越個人得失」的中介一環"},{"id":"src_essay_052","sourceId":"052","origin":"attachment","chapter":"《岳陽樓記》","difficulty":"advanced","type":"essay","quote":"若夫霪雨霏霏，連月不開……至若春和景明，波瀾不驚……","question":"文中兩段寫景（陰雨、晴明）如何配合抒情？試說明。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"陰雨段寫景","mark":1,"detail":"霪雨、陰風、濁浪、虎嘯猿啼。","keywords":[]},{"point":"陰雨段之情","mark":1,"detail":"觸發「感極而悲」。","keywords":[]},{"point":"晴明段寫景","mark":1,"detail":"春和景明、皓月千里、漁歌互答。","keywords":[]},{"point":"晴明段之情","mark":1,"detail":"觸發「喜洋洋」。","keywords":[]}],"modelAnswer":"陰雨段寫「霪雨霏霏，連月不開」，陰風怒號、濁浪排空（1 分），蕭瑟之景觸發遷客騷人「感極而悲」之情（1 分）；晴明段寫「春和景明，波瀾不驚」，皓月千里、漁歌互答（1 分），明麗之景觸發「其喜洋洋」之情（1 分）。兩段皆情景交融，以景生情。","diagnosis":"寫景與抒情脫節；兩段景情錯配；未點出「情景交融」的關係","commonMistakes":"寫景與抒情脫節；兩段景情錯配；未點出「情景交融」的關係"},{"id":"src_essay_053","sourceId":"053","origin":"attachment","chapter":"《岳陽樓記》","difficulty":"top","type":"essay","quote":"慶曆四年春，滕子京謫守巴陵郡。……微斯人，吾誰與歸？","question":"范仲淹藉《岳陽樓記》對滕子京表達了甚麼勸勉？","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"背景","mark":1,"detail":"滕子京謫守巴陵的背景。","keywords":[]},{"point":"借遷客對照","mark":1,"detail":"借遷客騷人以物悲喜對照。","keywords":[]},{"point":"提出古仁人","mark":1,"detail":"提出「不以物喜，不以己悲」的古仁人之心。","keywords":[ ommonMistakes":"只堆砌形容詞而不分層說明；把「羽扇綸巾」誤屬諸葛亮；遺漏以周瑜反襯自己、抒壯志未酬的用意"},{"id":"src_essay_061","sourceId":"061","origin":"attachment","chapter":"《念奴嬌·赤壁懷古》","difficulty":"advanced","type":"essay","quote":"大江東去，浪淘盡、千古風流人物。故壘西邊，人道是、三國周郎赤壁。亂石穿空，驚濤拍岸，捲起千堆雪。","question":"上片如何寫赤壁之景？這番景色對下文有何作用？","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"寫景內容","mark":1,"detail":"大江、故壘、亂石、驚濤、千堆雪。","keywords":[]},{"point":"景色特點","mark":1,"detail":"雄奇壯闊。","keywords":[]},{"point":"引出豪傑","mark":1,"detail":"「江山如畫，一時多少豪傑」，由景及人。","keywords":[]},{"point":"為懷古張本","mark":1,"detail":"為下片懷古（周瑜）作鋪墊。","keywords":[]}],"modelAnswer":"上片寫大江東去、故壘西邊，亂石穿空、驚濤拍岸，捲起千堆雪（1 分），景色雄奇壯闊（1 分）。「江山如畫，一時多少豪傑」，由壯景引出豪傑（1 分），為下片遙想周瑜、抒發懷古之情張本（1 分）。","diagnosis":"只述景而不析其作用；漏掉「由景及人」的過渡；未扣「為懷古張本」","commonMistakes":"只述景而不析其作用；漏掉「由景及人」的過渡；未扣「為懷古張本」"},{"id":"src_essay_062","sourceId":"062","origin":"attachment","chapter":"《念奴嬌·赤壁懷古》","difficulty":"advanced","type":"essay","quote":"遙想公瑾當年，小喬初嫁了，雄姿英發。羽扇綸巾，談笑間、檣櫓灰飛煙滅。","question":"蘇軾筆下的周瑜有何特點？試分點說明。","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":4,"rubric":[{"point":"少年得志","mark":1,"detail":"「小喬初嫁了，雄姿英發」，風華正茂。","keywords":[]},{"point":"儒雅風流","mark":1,"detail":"「羽扇綸巾」，裝束儒雅。","keywords":[]},{"point":"從容破敵","mark":1,"detail":"「談笑間、檣櫓灰飛煙滅」，指揮若定。","keywords":[]},{"point":"與己對照","mark":1,"detail":"英雄形象與自己早生華髮對照。","keywords":[]}],"modelAnswer":"蘇軾筆下的周瑜：少年得志，以「小喬初嫁了，雄姿英發」側寫其風華正茂（1 分）；儒雅風流，以「羽扇綸巾」勾勒其瀟灑儒將風度（1 分）；從容破敵，以「談笑間、檣櫓灰飛煙滅」寫其指揮若定（1 分）。這英雄形象正與自己「早生華髮」形成對照（1 分）。","diagnosis":"形容詞堆砌而不分點；把「羽扇綸巾」誤屬諸葛亮；漏掉「與己對照」一層","commonMistakes":"形容詞堆砌而不分點；把「羽扇綸巾」誤屬諸葛亮；漏掉「與己對照」一層"},{"id":"src_essay_063","sourceId":"063","origin":"attachment","chapter":"《念奴嬌·赤壁懷古》","difficulty":"top","type":"essay","quote":"故國神遊，多情應笑我，早生華髮。人生如夢，一尊還酹江月。","question":"詞人為何「多情應笑我，早生華髮」？其中包含哪些情感？","options":[],"answerIndex":0,"explanation":"","distractorAnalysis":[],"marks":5,"rubric":[{"point":"追慕周瑜","mark":1,"detail":"神遊故國，追慕周瑜功業。","keywords":[]},{"po    const oldCurrent=saved.currentQuestion||saved.current;if(validQuestion(oldCurrent))state.current=oldCurrent;
   const oldSelected=Number.isInteger(saved.selectedIndex)?saved.selectedIndex:saved.selected;if(Number.isInteger(oldSelected))state.selected=oldSelected;
   const oldDraft=typeof saved.userDraft==="string"?saved.userDraft:saved.draft;if(typeof oldDraft==="string")state.draft=oldDraft;
   const oldResult=saved.essayResult||saved.result;if(oldResult&&typeof oldResult==="object")state.result=oldResult;

  }

function localScore(question,answer){

 const points=question.rubric.map(function(rule){
  const achieved=rule.keywords.some(function(keyword){return normalized.includes(keyword.toLowerCase().replace(/\s/g,""))});
  const score=achieved?rule.mark:0;total+=score;return{point:rule.point,achieved:achieved,score:score,max:rule.mark}
 });
 const missing=points.filter(function(point){return!point.achieved}).map(function(point){return point.point});
 return{source:"local",score:total,points:points,modelAnswer:question.modelAnswer,diagnosis:missing.length?"目前答案未涵蓋："+missing.join("、")+"。本地模擬只按關鍵詞估算，語意相近但未命中也可能未計分。":"答案包含各項參考要點；本地模擬不能完整判斷語意。",suggestion:missing.length?"按題目逐點補充「論點＋具體引文或例子＋分析」，並檢查有否回應比較或作用等要求。":"可補充具體引文分析，讓每個要點更清楚連結題目。"}
}
